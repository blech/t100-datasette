{% extends "query.html" %}

{% block extra_head %}
{{ super() }}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    #map {
        width: 100%;
        height: 500px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
</style>
{% endblock %}

{% block content %}
<div id="map"></div>

{{ super() }}

<script type="module">
import { GreatCircle } from 'https://cdn.skypack.dev/arc@1.0.0';
document.addEventListener("DOMContentLoaded", function() {
    // 1. Initialize the map
    var map = L.map('map').setView([20, 0], 2); // Centered globally

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    }).addTo(map);

    // 2. Fetch the GeoJSON payload of this exact query page
    // appending .geojson preserves any active URL parameters/filters
    var geojsonUrl = window.location.pathname + ".geojson" + window.location.search;

    fetch(geojsonUrl)
        .then(response => response.json())
        .then(data => {
            // Center the map on the origin if data exists
            if (data.features?.length && data.features.length > 0) {
                var origin = data.features[0].properties;
                if (origin.origin_lat && origin.origin_lon) {
                    // Smoothly pan and zoom to the origin airport
                    map.setView([parseFloat(origin.origin_lat), parseFloat(origin.origin_lon)], 2);

                    // Add origin airport marker
                    L.circleMarker([origin.origin_lat, origin.origin_lon], {
                            radius: 6,
                            color: '#ff4444',
                            fillColor: '#ff4444',
                            fillOpacity: 1
                        }).addTo(map).bindPopup(`Origin: ${origin.origin_code || 'Home'}`);
                }
            };

            // Draw destination arcs
            data.features.forEach(function(feature) {
                var props = feature.properties;

                // Ensure all coordinates exist for this row
                if (props.origin_lat && props.origin_lon && props.destination_lat && props.destination_lon) {

                    var start = { x: parseFloat(props.origin_lon), y: parseFloat(props.origin_lat) };
                    var end = { x: parseFloat(props.destination_lon), y: parseFloat(props.destination_lat) };

                    // 3. Calculate Great Circle properties using Arc.js
                    var generator = new GreatCircle(start, end);

                    // 4. Convert Arc.js object to Leaflet GeoJSON and style it
                    var line = generator.Arc(100, { offset: 10 }); // 100 intermediate points for smoothness
                    var lineJson = line.json();

                    if (lineJson.geometry.type === "MultiLineString") {
                        // The route crosses the dateline and has been split into multiple segments
                        lineJson.geometry.coordinates.forEach(function(coords) {
                            // Map the coordinates into Leaflet LatLng objects
                            var leafletCoords = coords.map(function(coord) {
                                var lon = coord[0];
                                var lat = coord[1];

                                /* If your origin is in Asia/Japan (positive longitude) and the route
                                   crosses east toward the US West Coast (negative longitude), Leaflet needs
                                   those negative longitudes shifted into the +180 to +360 range so they
                                   render on the adjacent eastern pane instead of snapping backwards.
                                */
                                if (start.x > 0 && lon < 0) {
                                    lon += 360;
                                }
                                /* Conversely, if your origin is the US West Coast (negative longitude)
                                   and you are flying west towards Asia (positive longitude), shift the
                                   Asian longitudes into negative space (-180 to -360) to stay on the western pane.
                                */
                                else if (start.x < 0 && lon > 0) {
                                    lon -= 360;
                                }

                                return L.latLng(lat, lon);
                            });

                            // Draw this specific segment clearly on the expanded canvas
                            L.polyline(leafletCoords, {
                                color: '#ff5a00',
                                weight: 2,
                                opacity: 0.6
                            }).addTo(map);
                        });
                    } else {
                        // Standard route that doesn't cross the dateline (Single LineString)
                        var leafletCoords = lineJson.geometry.coordinates.map(function(coord) {
                            return L.latLng(coord[1], coord[0]);
                        });

                        L.polyline(leafletCoords, {
                            color: '#ff5a00',
                            weight: 2,
                            opacity: 0.6
                        }).addTo(map);
                    }

                    // var leafletLine = L.geoJSON(line.json(), {
                    //     style: {
                    //         color: '#3388ff',
                    //         weight: 2,
                    //         opacity: 0.6
                    //     }
                    // }).addTo(map);

                    // Optional: Add popups when clicking a line
                    if (props.origin_code && props.destination_code) {
                        leafletLine.bindPopup(`Route: ${props.origin_code} &rarr; ${props.destination_code}`);
                    }
                }
            });
        })
        .catch(err => console.error("Error loading flight path GeoJSON:", err));
});
</script>
{% endblock %}
