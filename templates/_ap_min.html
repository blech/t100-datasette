{% if europe %}<select id="ap-min" aria-label="Minimum passengers">{% for v in (5000, 25000, 50000, 250000) %}<option value="{{ v }}"{% if v == 5000 %} selected{% endif %}>{{ "{:,}".format(v * 2 if dir == "" else v) }} passengers</option>{% endfor %}</select>{% else %}<select id="ap-min" aria-label="Minimum {{ count_word|lower }}">{% for v in (1, 12, 52, 365) %}<option value="{{ v }}"{% if v == 12 %} selected{% endif %}>{% if v == 1 %}once{% else %}{{ v * 2 if dir == "" else v }} times{% endif %}</option>{% endfor %}</select>{% endif %}
