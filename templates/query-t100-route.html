{% extends "query.html" %}

{% block extra_head %}
{{ super() }}
<link rel="stylesheet" href="/static/charts/style.css">
{% endblock %}

{% block content %}
<section id="route-chart" hidden>
  <div class="chart-controls">
    <label>Show <select id="chart-measure" aria-label="Measure"></select></label>
    <label>Split by <select id="chart-split" aria-label="Split by"></select></label>
  </div>
  <div id="route-chart-plot" aria-live="polite">Loading chart…</div>
</section>

{{ super() }}

<script type="module" src="/static/charts/route.js"></script>
{% endblock %}
