# fly.toml app configuration file

app = 'blech-datasette-t100'
primary_region = 'ord'

[build]

[http_service]
  internal_port = 8808
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1
  processes = ['app']

[env]
  T100_USAGE_LOG = '/mnt/db/usage'

[mounts]
  source="t100_db"
  destination="/mnt/db"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
