settings:
  default_page_size: 100
  max_returned_rows: 50000
  sql_time_limit_ms: 5000

plugins:
  t100_globe:
    min_year: 1990
    max_year: 2025

databases:
  t100:
    title: T-100 Segment Data (International and Domestic), 1990-2025
    source: Data Bank 28IS and 28DS - T-100 and T-100(f) Segment Data, U.S. and Foreign Air Carriers Traffic and Capacity Data
    source_url: https://www.bts.gov/browse-statistical-products-and-data/bts-publications/%E2%80%A2-data-bank-28is-t-100-and-t-100f

    queries:
      airports:
        sql: |
          SELECT
            a.code, a.name, a.city, a.country, a.latitude, a.longitude, a.icao,
            COALESCE(n.name, a.city || ', ' || a.country) AS place,
            CASE WHEN a.country IN ('United States', 'Puerto Rico', 'Guam', 'Virgin Islands',
                                    'American Samoa', 'Northern Mariana Islands')
                 THEN 1 ELSE 0 END AS is_us
          FROM (
            SELECT iata_code AS code, name, city, country, latitude, longitude,
              CASE WHEN icao_code IN ('', '\N') THEN NULL ELSE icao_code END AS icao
            FROM openflights_airports
            WHERE iata_code IS NOT NULL
              AND iata_code NOT IN ('', '\N')
              AND latitude IS NOT NULL AND longitude IS NOT NULL
              AND iata_code NOT IN (SELECT code FROM airport_overrides)
            UNION ALL
            SELECT code, name, city, country, latitude, longitude, NULL AS icao FROM airport_overrides
          ) AS a
          LEFT JOIN airport_names AS n ON n.code = a.code
          ORDER BY a.code

      top_us_airports:
        title: "US airports by traffic"
        description: "One row per airport: its traffic from it, for the year given, or every year when it is empty."
        sql: |
          SELECT
            origin,
            origin_city_name,
            CAST(SUM(departures_performed) AS integer) AS total_deps,
            CAST(SUM(passengers) AS integer) AS total_passengers,
            CAST(SUM(seats) AS integer) AS total_seats,
            CAST(SUM(freight) AS integer) AS total_freight,
            '/t100/destinations?origin=' || origin || '&_hide_sql=1' AS more_detail
          FROM t100
          WHERE origin_wac BETWEEN 1 AND 93
            AND year = COALESCE(NULLIF(:year, ''), 2025)
          GROUP BY origin, origin_wac, origin_city_name
          ORDER BY
            CASE :sort_column
              WHEN 'Departures' THEN total_deps
              WHEN 'Seats' THEN total_seats
              WHEN 'Freight' THEN total_freight
              ELSE total_passengers
            END
            DESC
          LIMIT 100;

      top_airports:
        title: "Busiest US airports in a year or all years"
        description: "One row per US airport: its flights both ways (or set dir to out for departures, in for arrivals), seats, passengers, freight, other airports flown to or from at least 24 times both ways or 12 one way (in some year, for all years), and its BTS city market with the market's own count (abroad, also its country and the country's own count). Leave year empty for all years. Set region to abroad for the airports outside the US instead, ranked by their flights to and from the US (all of those are international, so domestic finds none). Set service to domestic or international for the flights in that BTS file, with destinations counting the routes the matrices call that (empty or all counts everything)."
        sql: |
          -- dests: other airports with at least 24 flights both ways (12 one way) in the year, or in some year for all years, each
          -- counted once, the cut-off the maps and matrices use; market_dests counts each one once for all the market's airports
          -- one way, each leg of 12+ as flown (x to y); both ways, each pair once (x before y) with 24+ its two legs together, which
          -- needs a leg of 12+, so those legs are the candidates and the reverse leg is looked up by its key
          -- service (all, domestic or international): dests count only the routes the matrices call that (most of the route's
          -- departures, in the directions asked for, in the domestic file); the totals are the airport's flights in the domestic or the
          -- international file, as airport_size splits them (by_service). For all (or empty) the totals come straight from
          -- airport_dir_year, which is faster
          WITH pairs AS (
            SELECT CASE WHEN :dir IN ('out', 'in') THEN r.origin ELSE MIN(r.origin, r.dest) END AS x,
                   CASE WHEN :dir IN ('out', 'in') THEN r.dest ELSE MAX(r.origin, r.dest) END AS y
            FROM route_year_totals AS r
            LEFT JOIN route_year_totals AS back ON :dir NOT IN ('out', 'in') AND back.year = r.year AND back.origin = r.dest AND back.dest = r.origin
            WHERE (:year IN ('', 'all') OR r.year = CAST(:year AS integer)) AND r.deps >= 12
              AND (:dir IN ('out', 'in') OR r.deps + COALESCE(back.deps, 0) >= 24)
              AND (:service IN ('', 'all') OR CASE WHEN (r.domestic_deps + COALESCE(back.domestic_deps, 0)) * 2 > r.deps + COALESCE(back.deps, 0)
                   THEN 'domestic' ELSE 'international' END = :service)
            GROUP BY 1, 2
          ),
          partners AS (
            SELECT x AS airport, y AS other FROM pairs WHERE :dir <> 'in'
            UNION ALL
            SELECT y, x FROM pairs WHERE :dir <> 'out'
          ),
          dests AS (SELECT airport, COUNT(DISTINCT other) AS dests FROM partners GROUP BY airport),
          market_dests AS (
            SELECT m.market_id, COUNT(DISTINCT p.other) AS market_dests
            FROM partners AS p JOIN airport_market AS m ON m.code = p.airport GROUP BY m.market_id
          ),
          by_service AS (
            SELECT airport, SUM(CASE :dir WHEN 'out' THEN deps WHEN 'in' THEN arrs ELSE deps + arrs END) AS deps,
              SUM(CASE :dir WHEN 'out' THEN seats_out WHEN 'in' THEN seats_in ELSE seats_out + seats_in END) AS seats,
              SUM(CASE :dir WHEN 'out' THEN passengers_out WHEN 'in' THEN passengers_in ELSE passengers_out + passengers_in END) AS passengers,
              SUM(CASE :dir WHEN 'out' THEN freight_out WHEN 'in' THEN freight_in ELSE freight_out + freight_in END) AS freight
            FROM airport_carrier_dir_year
            WHERE :service IN ('domestic', 'international') AND domestic = (:service = 'domestic')
              AND (:year IN ('', 'all') OR year = CAST(:year AS integer))
            GROUP BY airport
          ),
          totals AS (
            SELECT a.airport,
              CASE WHEN :service IN ('', 'all') THEN SUM(CASE :dir WHEN 'out' THEN a.deps WHEN 'in' THEN a.arrs ELSE a.deps + a.arrs END) ELSE s.deps END AS n_deps,
              CASE WHEN :service IN ('', 'all') THEN SUM(CASE :dir WHEN 'out' THEN a.seats_out WHEN 'in' THEN a.seats_in ELSE a.seats_out + a.seats_in END) ELSE s.seats END AS n_seats,
              CASE WHEN :service IN ('', 'all') THEN SUM(CASE :dir WHEN 'out' THEN a.passengers_out WHEN 'in' THEN a.passengers_in ELSE a.passengers_out + a.passengers_in END) ELSE s.passengers END AS n_passengers,
              CASE WHEN :service IN ('', 'all') THEN SUM(CASE :dir WHEN 'out' THEN a.freight_out WHEN 'in' THEN a.freight_in ELSE a.freight_out + a.freight_in END) ELSE s.freight END AS n_freight,
              CASE WHEN :year IN ('', 'all') THEN (SELECT n.city_name FROM airport_dir_year AS n WHERE n.airport = a.airport ORDER BY n.year DESC LIMIT 1)
                ELSE MAX(a.city_name) END AS city
            FROM airport_dir_year AS a
            LEFT JOIN by_service AS s ON s.airport = a.airport
            WHERE (:year IN ('', 'all') OR a.year = CAST(:year AS integer)) AND CASE WHEN :region = 'abroad' THEN a.wac NOT BETWEEN 1 AND 93 ELSE a.wac BETWEEN 1 AND 93 END
            GROUP BY a.airport
            HAVING n_deps > 0 OR n_seats > 0 OR n_passengers > 0 OR n_freight > 0
          ),
          -- country: abroad, what follows the first comma of the city name ("London, United Kingdom"); country_dests counts each
          -- other airport once for all the country's airports
          country_dests AS (
            SELECT SUBSTR(c.city, INSTR(c.city, ', ') + 2) AS country, COUNT(DISTINCT p.other) AS country_dests
            FROM partners AS p JOIN totals AS c ON c.airport = p.airport
            WHERE :region = 'abroad' AND c.city LIKE '%, %' GROUP BY 1
          )
          SELECT t.airport, t.city, t.n_deps AS deps, t.n_seats AS seats, t.n_passengers AS passengers, t.n_freight AS freight, COALESCE(d.dests, 0) AS dests,
            m.market_id, COALESCE(md.market_dests, COALESCE(d.dests, 0)) AS market_dests,
            cd.country, COALESCE(cd.country_dests, COALESCE(d.dests, 0)) AS country_dests
          FROM totals AS t
          LEFT JOIN dests AS d ON d.airport = t.airport
          LEFT JOIN country_dests AS cd ON cd.country = SUBSTR(t.city, INSTR(t.city, ', ') + 2) AND :region = 'abroad'
          LEFT JOIN airport_market AS m ON m.code = t.airport
          LEFT JOIN market_dests AS md ON md.market_id = m.market_id
          ORDER BY t.n_passengers DESC, t.airport

      # the airports matrix: every US airport that flew at least 365 times in some year, with all its years and its city market
      airport_by_year:
        title: "Airports by year"
        description: "One row per US airport (or, with region set to abroad, per airport outside the US, counting its flights to and from the US), year and service (domestic or international, by BTS file), counting flights both ways (or set dir to out for departures, in for arrivals), for airports with at least 730 flights both ways (365 one way) in some year, with each airport's BTS city market."
        sql: |
          -- big: the airports that ever flew enough; their flights come from airport_carrier_dir_year, split by the BTS file as airport_size does
          WITH big AS (
            SELECT airport FROM airport_dir_year
            WHERE CASE WHEN :region = 'abroad' THEN wac NOT BETWEEN 1 AND 93 ELSE wac BETWEEN 1 AND 93 END
            GROUP BY airport
            HAVING MAX(CASE :dir WHEN 'out' THEN deps WHEN 'in' THEN arrs ELSE deps + arrs END) >= CASE WHEN :dir IN ('out', 'in') THEN 365 ELSE 730 END
          )
          SELECT airport, city, market_id, year, service, deps, seats, passengers, freight FROM (
            SELECT c.airport, n.city_name AS city, m.market_id, c.year,
              CASE WHEN c.domestic = 1 THEN 'domestic' ELSE 'international' END AS service,
              SUM(CASE :dir WHEN 'out' THEN c.deps WHEN 'in' THEN c.arrs ELSE c.deps + c.arrs END) AS deps,
              SUM(CASE :dir WHEN 'out' THEN c.seats_out WHEN 'in' THEN c.seats_in ELSE c.seats_out + c.seats_in END) AS seats,
              SUM(CASE :dir WHEN 'out' THEN c.passengers_out WHEN 'in' THEN c.passengers_in ELSE c.passengers_out + c.passengers_in END) AS passengers,
              SUM(CASE :dir WHEN 'out' THEN c.freight_out WHEN 'in' THEN c.freight_in ELSE c.freight_out + c.freight_in END) AS freight
            FROM airport_carrier_dir_year AS c
            JOIN airport_dir_year AS n ON n.airport = c.airport AND n.year = c.year
            LEFT JOIN airport_market AS m ON m.code = c.airport
            WHERE c.airport IN (SELECT airport FROM big)
            GROUP BY c.airport, c.year, c.domestic
          )
          WHERE deps > 0 OR passengers > 0 OR freight > 0
          ORDER BY year, airport

      # the routes matrix: the airport pairs that could be among its top 50, by year, and every pair's totals for the shares of a year
      top_routes_by_year:
        title: "The busiest airport pairs by year"
        description: "One row per airport pair (both directions together, origin before dest) and year, with its service and distance in miles, for the pairs in the top 50 of their service and distance band by flights, seats, passengers or freight, over all years or, with year set, in that year, and the busiest pair of each band in each year. Rows with rest = 1 are every pair's totals for a year, service and distance band (distance is the band's lower bound), counting those not listed."
        sql: |
          WITH kept AS (
            SELECT DISTINCT a, b FROM top_route_year
            WHERE year_rank = 1 OR (CASE WHEN :year = '' THEN overall_rank WHEN year = CAST(:year AS integer) THEN year_rank END) <= 50
          )
          SELECT a AS origin, b AS dest, year, service, distance, band, deps, seats, passengers, freight, 0 AS rest
          FROM top_route_year JOIN kept USING (a, b)
          UNION ALL
          SELECT '', '', year, service, band, band, deps, seats, passengers, freight, 1
          FROM route_band_year
          ORDER BY year, rest, passengers DESC

      # the routes matrix grouped by city: the BTS city market pairs that could be among its top 50, as top_routes_by_year
      top_markets_by_year:
        title: "The busiest city market pairs by year"
        description: "One row per pair of BTS city markets (New York is JFK, LaGuardia and Newark; both directions together) and year, with each market's name, the pair's service, and its distance in miles (its airport pairs' distances weighted by passengers), for the market pairs in the top 50 of their service and distance band by flights, seats, passengers or freight, over all years or, with year set, in that year, and the busiest of each band in each year. Flights within one market are left out. Rows with rest = 1 are every market pair's totals for a year, service and distance band (distance is the band's lower bound). market_pairs_by_year lists a market pair's airport pairs."
        sql: |
          WITH kept AS (
            SELECT DISTINCT ma, mb FROM top_market_year
            WHERE year_rank = 1 OR (CASE WHEN :year = '' THEN overall_rank WHEN year = CAST(:year AS integer) THEN year_rank END) <= 50
          )
          SELECT t.ma, t.mb, na.name AS name_a, nb.name AS name_b, year, service, distance, band, deps, seats, passengers, freight, 0 AS rest
          FROM top_market_year AS t JOIN kept USING (ma, mb)
          LEFT JOIN market_name AS na ON na.market_id = t.ma LEFT JOIN market_name AS nb ON nb.market_id = t.mb
          UNION ALL
          SELECT '', '', '', '', year, service, band, band, deps, seats, passengers, freight, 1
          FROM market_band_year
          ORDER BY year, rest, passengers DESC

      # a city market pair's airport pairs: the city pair page's matrix (/airports/cities/ma/mb), for any two markets, read live from
      # route_year_totals through its origin and dest indexes
      market_pairs_by_year:
        title: "A city market pair's airport pairs by year"
        description: "One row per airport pair (both directions together) and year between two BTS city markets (ids as airport_market's market_id, in either order), with origin in the market given as ma and dest in mb, and the pair's service and distance in miles."
        sql: |
          WITH a AS (SELECT code FROM airport_market WHERE market_id = :ma AND :ma <> :mb),
               b AS (SELECT code FROM airport_market WHERE market_id = :mb)
          SELECT r.origin, r.dest, r.year,
            CASE WHEN SUM(r.domestic_deps) * 2 > SUM(r.deps) THEN 'domestic' ELSE 'international' END AS service,
            d.distance, SUM(r.deps) AS deps, SUM(r.seats) AS seats, SUM(r.passengers) AS passengers, SUM(r.freight) AS freight
          FROM (
            SELECT t.origin, t.dest, t.year, t.deps, t.domestic_deps, t.seats, t.passengers, t.freight
            FROM a JOIN route_year_totals AS t ON t.origin = a.code WHERE t.dest IN b
            UNION ALL
            SELECT t.dest, t.origin, t.year, t.deps, t.domestic_deps, t.seats, t.passengers, t.freight
            FROM b JOIN route_year_totals AS t ON t.origin = b.code WHERE t.dest IN a
          ) AS r
          LEFT JOIN pair_distance AS d ON d.a = MIN(r.origin, r.dest) AND d.b = MAX(r.origin, r.dest)
          GROUP BY r.origin, r.dest, r.year
          ORDER BY r.year, passengers DESC

      # a city market's routes: the city page's destinations matrix (/airports/cities/market), as routes_by_year is an airport's, with
      # every airport of the market counted together and flights within it left out
      market_routes_by_year:
        title: "Other airports from and to a city market, by year"
        description: "One row per airport outside the BTS city market (dest) and year, counting flights both ways from every airport in the market, or set dir to out (departures) or in (arrivals), with routes under the minimum flights (24 both ways, 12 one way, when empty) left out, and the distance in miles from the market's airports, weighted by passengers."
        sql: |
          WITH here AS (SELECT code FROM airport_market WHERE market_id = :market)
          SELECT
            r.dest,
            m.market_id,
            n.name AS city,
            CAST(ROUND(COALESCE(
              SUM(CASE WHEN d.distance > 0 THEN d.distance * r.passengers END) * 1.0 / NULLIF(SUM(CASE WHEN d.distance > 0 THEN r.passengers END), 0),
              SUM(CASE WHEN d.distance > 0 THEN d.distance * r.deps END) * 1.0 / NULLIF(SUM(CASE WHEN d.distance > 0 THEN r.deps END), 0))) AS integer) AS distance,
            r.year,
            SUM(r.deps) AS deps,
            SUM(r.seats) AS seats,
            SUM(r.passengers) AS passengers,
            SUM(r.freight) AS freight,
            CASE WHEN SUM(r.domestic_deps) * 2 > SUM(r.deps) THEN 'domestic' ELSE 'international' END AS service
          FROM (
            SELECT t.origin AS airport, t.dest, t.year, t.deps, t.domestic_deps, t.seats, t.passengers, t.freight
            FROM here JOIN route_year_totals AS t ON t.origin = here.code WHERE :dir <> 'in'
            UNION ALL
            SELECT t.dest, t.origin, t.year, t.deps, t.domestic_deps, t.seats, t.passengers, t.freight
            FROM here JOIN route_year_totals AS t ON t.dest = here.code WHERE :dir <> 'out'
          ) AS r
          LEFT JOIN airport_names n ON n.code = r.dest
          LEFT JOIN airport_market m ON m.code = r.dest
          LEFT JOIN pair_distance d ON d.a = MIN(r.airport, r.dest) AND d.b = MAX(r.airport, r.dest)
          WHERE r.dest NOT IN here
          GROUP BY r.dest, r.year
          HAVING SUM(r.deps) >= CAST(COALESCE(NULLIF(:min_deps, ''), CASE WHEN :dir IN ('out', 'in') THEN 12 ELSE 24 END) AS integer)
            AND (SUM(r.deps) > 0 OR SUM(r.passengers) > 0 OR SUM(r.freight) > 0)
          ORDER BY r.year, r.dest

      # the front page map: the 100 busiest US airports by passengers in one year (column named as the chooser's)
      busiest_airports:
        sql: |
          -- passengers boarding or leaving there: both directions
          SELECT airport, city_name AS city, passengers_out + passengers_in AS passengers
          FROM airport_dir_year
          WHERE year = CAST(:year AS integer)
            AND wac BETWEEN 1 AND 93
            AND passengers_out + passengers_in > 0
          ORDER BY passengers DESC, airport
          LIMIT 100

      # the network globe's list and dots: US airports by passengers boarding or leaving there, over all years
      globe_chooser:
        sql: |
          SELECT d.airport, COALESCE(n.name, MAX(d.city_name)) AS city, SUM(d.passengers_out + d.passengers_in) AS passengers
          FROM airport_dir_year d
          LEFT JOIN airport_names n ON n.code = d.airport
          WHERE d.wac BETWEEN 1 AND 93
          GROUP BY d.airport
          HAVING passengers > 0
          ORDER BY passengers DESC, d.airport
          LIMIT 100

      # the most dedicated airports: of the biggest US airports by passengers (100) or freight (25) in one year, the ten whose
      # biggest airline group carries the largest share of what boards or leaves there. Reads airport_carrier_dir_year, so it is
      # a small query whatever the year; measure is 'passengers' or 'freight' (anything else counts as passengers)
      dedicated_airports:
        title: "Airports dominated by one airline"
        sql: |
          -- passengers or freight boarding or leaving there: both directions
          WITH by_airline AS (
            SELECT airport, group_id, MIN(group_name) AS group_name,
                   SUM(CASE :measure WHEN 'freight' THEN freight_out + freight_in ELSE passengers_out + passengers_in END) AS value
            FROM airport_carrier_dir_year
            WHERE year = CAST(:year AS integer) AND wac BETWEEN 1 AND 93
            GROUP BY airport, group_id
          ), totals AS (
            SELECT airport, SUM(value) AS total FROM by_airline GROUP BY airport HAVING SUM(value) > 0
          ), biggest AS (
            SELECT airport, total, ROW_NUMBER() OVER (ORDER BY total DESC, airport) AS size_rank FROM totals
          ), leaders AS (
            SELECT b.airport, b.size_rank, b.total, a.group_id, a.group_name, a.value AS airline_total,
                   ROW_NUMBER() OVER (PARTITION BY b.airport ORDER BY a.value DESC, a.group_id) AS place
            FROM biggest b JOIN by_airline a ON a.airport = b.airport
            WHERE b.size_rank <= CASE :measure WHEN 'freight' THEN 25 ELSE 100 END
          )
          SELECT l.airport, y.city_name AS city, l.size_rank, l.total, l.group_id, l.group_name, l.airline_total,
                 1.0 * l.airline_total / l.total AS share
          FROM leaders l
          LEFT JOIN airport_dir_year y ON y.airport = l.airport AND y.year = CAST(:year AS integer)
          WHERE l.place = 1
          ORDER BY share DESC, l.total DESC, l.airport
          LIMIT 10

      # airport risers and fallers: each US airport's passengers, flights or destinations in a first and a last year, as a ratio and against
      # the median ratio of the airports considered, with its busiest year in between. measure: passengers (both ways, as the other
      # airport queries count them, and what anything else means), flights (departures and arrivals) or destinations (the other airports
      # it has 24 flights both ways with in the year, and 12 or more one way: the rule top_airports and the matrices use). Reads
      # airport_dir_year (one row an airport and year) and, for destinations, route_year_totals (one a pair and year): a small query
      # for any range
      airport_movers:
        title: "Airports growing faster or slower than the median"
        description: "One row per US airport with at least min_value passengers (measure passengers, both directions), flights (departures and arrivals) or destinations (other airports it has at least 24 flights both ways with in the year, 12 one way) in from_year: its figure then and in to_year (nothing if it had none), the ratio of the two, that ratio against the median ratio of the airports listed (vs_median, 1 is the median airport; lost is 1 for an airport with under 1% of its first year's figure left, which the median leaves out), and the busiest year from from_year to to_year with the figure then and the latest year's share of it (vs_peak). Fastest growing first."
        sql: |
          WITH pairs AS (
            -- destinations: each airport pair once a year, if it has 12+ flights one way and 24+ both ways. A flight from an airport to
            -- itself (a sightseeing loop, at Grand Canyon or Kenai say) is not a destination: top_airports counts those, so its dests
            -- can be one more than this for an airport that has them
            SELECT r.year, MIN(r.origin, r.dest) AS x, MAX(r.origin, r.dest) AS y
            FROM route_year_totals AS r
            LEFT JOIN route_year_totals AS back ON back.year = r.year AND back.origin = r.dest AND back.dest = r.origin
            WHERE :measure = 'destinations' AND r.year BETWEEN CAST(:from_year AS integer) AND CAST(:to_year AS integer)
              AND r.origin <> r.dest AND r.deps >= 12 AND r.deps + COALESCE(back.deps, 0) >= 24
            GROUP BY r.year, x, y
          ), dests AS (
            SELECT year, airport, COUNT(*) AS n
            FROM (SELECT year, x AS airport FROM pairs UNION ALL SELECT year, y FROM pairs)
            GROUP BY year, airport
          ), yr AS (
            SELECT airport, year, city_name AS city, CASE :measure WHEN 'flights' THEN deps + arrs ELSE passengers_out + passengers_in END AS value
            FROM airport_dir_year
            WHERE :measure <> 'destinations' AND wac BETWEEN 1 AND 93 AND year BETWEEN CAST(:from_year AS integer) AND CAST(:to_year AS integer)
            UNION ALL
            SELECT d.airport, d.year, a.city_name, d.n
            FROM dests AS d JOIN airport_dir_year AS a ON a.airport = d.airport AND a.year = d.year
            WHERE :measure = 'destinations' AND a.wac BETWEEN 1 AND 93
          ), ends AS (
            -- an airport with nothing in the last year is a ratio of 0, the biggest fall there is
            -- lost: under 1% of the first year's figure left, which is an airport that has probably lost its service
            -- (Detroit City, DET: 720,000 passengers in 1990, 54 in 2025), not one that grew slowly: it is not in the median
            SELECT a.airport, COALESCE(b.city, a.city) AS city, a.value AS value_from, COALESCE(b.value, 0) AS value_to,
                   1.0 * COALESCE(b.value, 0) / a.value AS ratio, COALESCE(b.value, 0) < 0.01 * a.value AS lost
            FROM yr AS a LEFT JOIN yr AS b ON b.airport = a.airport AND b.year = CAST(:to_year AS integer)
            WHERE a.year = CAST(:from_year AS integer) AND a.value > 0 AND a.value >= CAST(:min_value AS integer)
          ), ranked AS (
            SELECT ratio, ROW_NUMBER() OVER (ORDER BY ratio) AS place, COUNT(*) OVER () AS n FROM ends WHERE NOT lost
          ), median AS (
            -- the middle airport's ratio, or the mean of the middle two
            SELECT AVG(ratio) AS ratio FROM ranked WHERE place IN ((n + 1) / 2, (n + 2) / 2)
          ), peaks AS (
            SELECT airport, year AS peak_year, value AS peak_value,
                   ROW_NUMBER() OVER (PARTITION BY airport ORDER BY value DESC, year DESC) AS place
            FROM yr
          )
          SELECT e.airport, e.city, e.value_from, e.value_to, e.ratio, m.ratio AS median_ratio, e.ratio / m.ratio AS vs_median, e.lost,
                 p.peak_year, p.peak_value, 1.0 * e.value_to / p.peak_value AS vs_peak
          FROM ends AS e
          CROSS JOIN median AS m
          JOIN peaks AS p ON p.airport = e.airport AND p.place = 1
          ORDER BY e.ratio DESC, e.airport

      # the lines under airport_movers: every airport it lists (same measure, from_year, to_year and min_value), one row per year with its figure
      airport_movers_series:
        title: "Passengers, flights or destinations by year of the airports airport_movers lists"
        description: "One row per US airport airport_movers lists (the same measure, from_year, to_year and min_value) and per year from from_year to to_year in which it had any: value, its passengers, flights or destinations that year. For the lines of the risers and fallers page."
        sql: |
          WITH pairs AS (
            SELECT r.year, MIN(r.origin, r.dest) AS x, MAX(r.origin, r.dest) AS y
            FROM route_year_totals AS r
            LEFT JOIN route_year_totals AS back ON back.year = r.year AND back.origin = r.dest AND back.dest = r.origin
            WHERE :measure = 'destinations' AND r.year BETWEEN CAST(:from_year AS integer) AND CAST(:to_year AS integer)
              AND r.origin <> r.dest AND r.deps >= 12 AND r.deps + COALESCE(back.deps, 0) >= 24
            GROUP BY r.year, x, y
          ), dests AS (
            SELECT year, airport, COUNT(*) AS n
            FROM (SELECT year, x AS airport FROM pairs UNION ALL SELECT year, y FROM pairs)
            GROUP BY year, airport
          ), yr AS (
            SELECT airport, year, CASE :measure WHEN 'flights' THEN deps + arrs ELSE passengers_out + passengers_in END AS value
            FROM airport_dir_year
            WHERE :measure <> 'destinations' AND wac BETWEEN 1 AND 93 AND year BETWEEN CAST(:from_year AS integer) AND CAST(:to_year AS integer)
            UNION ALL
            SELECT d.airport, d.year, d.n
            FROM dests AS d JOIN airport_dir_year AS a ON a.airport = d.airport AND a.year = d.year
            WHERE :measure = 'destinations' AND a.wac BETWEEN 1 AND 93
          )
          SELECT airport, year, value
          FROM yr
          WHERE value > 0
            AND airport IN (
              SELECT airport FROM yr
              WHERE year = CAST(:from_year AS integer) AND value > 0 AND value >= CAST(:min_value AS integer)
            )
          ORDER BY airport, year

      # where one airport stands in one year, for the line under its heading: how big it is among the US airports, for passengers and
      # for freight (both directions, as dedicated_airports counts them), and how dedicated it is among the same pool of biggest
      # airports that page ranks (the top 100 for passengers, the top 25 for freight), by the largest airline group's share
      airport_ranks:
        title: "An airport's rank by size and by dedication in one year"
        description: "For one airport (origin) and year: for passengers and for freight, its total, its rank among the US airports with any, how many there are, the airline group carrying most of it with its share, and its rank by that share among the pool dedicated_airports ranks (empty outside the pool). Empty for an airport outside the US or with neither."
        sql: |
          WITH measures(measure) AS (VALUES ('passengers'), ('freight')),
          by_airline AS (
            SELECT m.measure, c.airport, c.group_id, MIN(c.group_name) AS group_name,
                   SUM(CASE m.measure WHEN 'freight' THEN c.freight_out + c.freight_in ELSE c.passengers_out + c.passengers_in END) AS value
            FROM airport_carrier_dir_year AS c CROSS JOIN measures AS m
            WHERE c.year = CAST(:year AS integer) AND c.wac BETWEEN 1 AND 93
            GROUP BY m.measure, c.airport, c.group_id
          ), totals AS (
            SELECT measure, airport, SUM(value) AS total FROM by_airline GROUP BY measure, airport HAVING SUM(value) > 0
          ), biggest AS (
            SELECT measure, airport, total, ROW_NUMBER() OVER (PARTITION BY measure ORDER BY total DESC, airport) AS size_rank,
                   COUNT(*) OVER (PARTITION BY measure) AS size_count
            FROM totals
          ), leaders AS (
            SELECT b.measure, b.airport, b.size_rank, b.size_count, b.total, a.group_id, a.group_name, a.value AS airline_total,
                   ROW_NUMBER() OVER (PARTITION BY b.measure, b.airport ORDER BY a.value DESC, a.group_id) AS place
            FROM biggest AS b JOIN by_airline AS a ON a.measure = b.measure AND a.airport = b.airport
          ), pool AS (
            SELECT *, 1.0 * airline_total / total AS share,
                   ROW_NUMBER() OVER (PARTITION BY measure ORDER BY 1.0 * airline_total / total DESC, total DESC, airport) AS dedicated_rank
            FROM leaders
            WHERE place = 1 AND size_rank <= CASE measure WHEN 'freight' THEN 25 ELSE 100 END
          )
          SELECT l.measure, l.total, l.size_rank, l.size_count, l.group_id, l.group_name, l.airline_total,
                 1.0 * l.airline_total / l.total AS share, p.dedicated_rank
          FROM leaders AS l LEFT JOIN pool AS p ON p.measure = l.measure AND p.airport = l.airport
          WHERE l.place = 1 AND l.airport = :origin
          ORDER BY l.measure DESC

      # the front page airline story: the share of all passengers carried by the four and ten biggest
      # reporting carriers each year (operating carriers, so regional partners count on their own)
      carrier_concentration:
        sql: |
          WITH totals AS (
            SELECT year, airline_id, SUM(passengers) AS passengers
            FROM carrier_group_year
            GROUP BY year, airline_id
            HAVING SUM(passengers) > 0
          ), ranked AS (
            SELECT year, passengers,
              ROW_NUMBER() OVER (PARTITION BY year ORDER BY passengers DESC, airline_id) AS rank,
              SUM(passengers) OVER (PARTITION BY year) AS total
            FROM totals
          )
          SELECT year,
            1.0 * SUM(CASE WHEN rank <= 4 THEN passengers ELSE 0 END) / MAX(total) AS top4,
            1.0 * SUM(CASE WHEN rank <= 10 THEN passengers ELSE 0 END) / MAX(total) AS top10,
            COUNT(*) AS carriers
          FROM ranked
          GROUP BY year
          ORDER BY year

      top_carriers:
        sql: |
          WITH totals AS (
            SELECT airline_id, SUM(passengers) AS passengers
            FROM carrier_group_year
            WHERE year = CAST(:year AS integer)
            GROUP BY airline_id
          )
          SELECT t.airline_id, COALESCE(g.airline_name, t.airline_id) AS airline_name,
            1.0 * t.passengers / (SELECT SUM(passengers) FROM totals) AS share
          FROM totals AS t
          LEFT JOIN carrier_group AS g ON g.airline_id = t.airline_id
          ORDER BY t.passengers DESC, t.airline_id
          LIMIT 4

      top_carrier_history:
        sql: |
          WITH totals AS (
            SELECT year, airline_id, SUM(passengers) AS passengers
            FROM carrier_group_year
            GROUP BY year, airline_id
          ), years AS (
            SELECT year, SUM(passengers) AS total FROM totals GROUP BY year
          ), four AS (
            SELECT airline_id FROM totals
            WHERE year = CAST(:year AS integer)
            ORDER BY passengers DESC, airline_id
            LIMIT 4
          )
          SELECT t.year, t.airline_id, COALESCE(g.airline_name, t.airline_id) AS airline_name,
            1.0 * t.passengers / y.total AS share, t.passengers, y.total
          FROM totals AS t
          JOIN four USING (airline_id)
          JOIN years AS y USING (year)
          LEFT JOIN carrier_group AS g ON g.airline_id = t.airline_id
          ORDER BY t.year, t.passengers DESC, t.airline_id

      destinations:
        sql: |
          SELECT
            year || '-' || printf('%02d', month) AS date,
            dest,
            dest_city_name,
            sum(departures_performed) as deps,
            sum(seats) as seats,
            sum(passengers) as total_pax,
            sum(freight) as freight,
            '/t100/route?origin=' || origin || '&dest=' || dest || '&_hide_sql=1' as more_detail
          FROM t100 AS t
          WHERE origin = :origin
            AND (NULLIF(:year, '') IS NULL OR year = CAST(:year AS integer))
          GROUP by dest, date
          ORDER BY
            date DESC,
            CASE :sort_column
              WHEN 'departures' THEN deps
              WHEN 'seats' THEN seats
              WHEN 'passengers' THEN total_pax
              WHEN 'freight' THEN freight
              ELSE dest_city_name
            END
            DESC
      routes_by_year:
        title: "Other airports from and to an airport, by year"
        description: "One row per other airport (dest) and year, counting flights both ways, or set dir to out (departures from the origin) or in (arrivals at it), with routes under the minimum flights (24 both ways, 12 one way, when empty) left out, and the pair's distance in miles."
        sql: |
          -- dir other than out or in counts both directions; dest is the other airport either way
          SELECT
            r.dest,
            m.market_id,
            n.name AS city,
            d.distance,
            r.year,
            SUM(r.deps) AS deps,
            SUM(r.seats) AS seats,
            SUM(r.passengers) AS passengers,
            SUM(r.freight) AS freight,
            CASE WHEN SUM(r.domestic_deps) * 2 > SUM(r.deps) THEN 'domestic' ELSE 'international' END AS service
          FROM (
            SELECT dest, year, deps, domestic_deps, seats, passengers, freight FROM route_year_totals WHERE origin = :origin AND :dir <> 'in'
            UNION ALL
            SELECT origin, year, deps, domestic_deps, seats, passengers, freight FROM route_year_totals WHERE dest = :origin AND :dir <> 'out'
          ) r
          LEFT JOIN airport_names n ON n.code = r.dest
          LEFT JOIN airport_market m ON m.code = r.dest
          LEFT JOIN pair_distance d ON d.a = MIN(:origin, r.dest) AND d.b = MAX(:origin, r.dest)
          GROUP BY r.dest, r.year
          HAVING SUM(r.deps) >= CAST(COALESCE(NULLIF(:min_deps, ''), CASE WHEN :dir IN ('out', 'in') THEN 12 ELSE 24 END) AS integer)
            AND (SUM(r.deps) > 0 OR SUM(r.passengers) > 0 OR SUM(r.freight) > 0)
          ORDER BY r.year, r.dest

      # an airport's flights by year, airline group, service and kind, for its charts, both ways or one
      airport_size:
        title: "Flights at an airport, by year, airline group, service and kind"
        description: "One row per year, airline group, domestic or international, and passenger or freight, counting flights both ways, or set dir to out (departures from the origin) or in (arrivals at it). Leave group empty for every airline."
        sql: |
          SELECT
            year, group_id, group_name,
            CASE WHEN domestic = 1 THEN 'domestic' ELSE 'international' END AS service,
            CASE WHEN service_class IN ('G', 'P') THEN 'freight' ELSE 'passenger' END AS kind,
            SUM(CASE :dir WHEN 'out' THEN deps WHEN 'in' THEN arrs ELSE deps + arrs END) AS deps,
            SUM(CASE :dir WHEN 'out' THEN seats_out WHEN 'in' THEN seats_in ELSE seats_out + seats_in END) AS seats,
            SUM(CASE :dir WHEN 'out' THEN passengers_out WHEN 'in' THEN passengers_in ELSE passengers_out + passengers_in END) AS passengers,
            SUM(CASE :dir WHEN 'out' THEN freight_out WHEN 'in' THEN freight_in ELSE freight_out + freight_in END) AS freight
          FROM airport_carrier_dir_year
          WHERE airport = :origin
            AND (:group = '' OR group_id = :group)
          GROUP BY year, group_id, group_name, service, kind
          HAVING deps > 0 OR seats > 0 OR passengers > 0 OR freight > 0
          ORDER BY year

      # each other airport and airline group at an airport in two years, with the first and last month flown, for what changed
      airport_changes:
        title: "Other airports and airline groups at an airport, in two years"
        description: "One row per other airport (dest) and airline group flown in either year, counting flights both ways, or set dir to out (departures from the origin) or in (arrivals at it), with the first and last month flown. Leave group empty for every airline."
        sql: |
          SELECT
            p.other AS dest,
            n.name AS city,
            p.group_id,
            COALESCE(g.group_name, 'Unknown carrier') AS group_name,
            SUM(CASE WHEN p.year = CAST(:a AS integer) THEN p.deps ELSE 0 END) AS deps_a,
            SUM(CASE WHEN p.year = CAST(:b AS integer) THEN p.deps ELSE 0 END) AS deps_b,
            SUM(CASE WHEN p.year = CAST(:a AS integer) THEN p.passengers ELSE 0 END) AS pax_a,
            MIN(p.year * 100 + p.first_month) AS first_ym,
            MAX(p.year * 100 + p.last_month) AS last_ym
          FROM (
            SELECT dest AS other, group_id, year, deps, passengers, first_month, last_month FROM carrier_pair_year WHERE origin = :origin AND :dir <> 'in'
            UNION ALL
            SELECT origin, group_id, year, deps, passengers, first_month, last_month FROM carrier_pair_year WHERE dest = :origin AND :dir <> 'out'
          ) p
          LEFT JOIN airport_names n ON n.code = p.other
          LEFT JOIN (SELECT group_id, MIN(group_name) AS group_name FROM carrier_group GROUP BY 1) g ON g.group_id = p.group_id
          WHERE :group = '' OR p.group_id = :group
          GROUP BY p.other, p.group_id
          HAVING deps_a > 0 OR deps_b > 0
          ORDER BY deps_a DESC, deps_b DESC

      # the changes page's "dropped at any point": the other airports (or, with show=airlines, the airline groups) flown at least
      # min times in some year from a up to b but not in b, so both those dropped and those added and dropped again in between.
      # Counts flights both ways, or set dir as airport_changes does. One row per item and member (its airline groups, or its
      # other airports) in the item's busiest year in that span, with the span. One pass with window functions, as
      # carrier_routes_gone
      airport_gone:
        title: "Other airports or airlines at an airport no longer flown by a year"
        description: "One row per other airport (or, with show=airlines, airline group) and member in its busiest year, for those flown at least min times (24 both ways, 12 one way, when empty) in some year from a up to b but not in b; counting flights both ways, or set dir to out or in; with the first and last such year, the busiest, and the flights in a."
        sql: |
          WITH p AS (
            SELECT dest AS other, group_id, year, deps FROM carrier_pair_year
            WHERE origin = :origin AND :dir <> 'in' AND year BETWEEN CAST(:a AS integer) AND CAST(:b AS integer)
            UNION ALL
            SELECT origin, group_id, year, deps FROM carrier_pair_year
            WHERE dest = :origin AND :dir <> 'out' AND year BETWEEN CAST(:a AS integer) AND CAST(:b AS integer)
          ),
          flown AS (
            SELECT
              CASE WHEN :show = 'airlines' THEN p.group_id ELSE p.other END AS code,
              CASE WHEN :show = 'airlines' THEN COALESCE(g.group_name, 'Unknown carrier') ELSE n.name END AS name,
              CASE WHEN :show = 'airlines' THEN p.other ELSE COALESCE(g.group_name, 'Unknown carrier') END AS member,
              p.year, SUM(p.deps) AS deps
            FROM p
            LEFT JOIN airport_names n ON n.code = p.other
            LEFT JOIN (SELECT group_id, MIN(group_name) AS group_name FROM carrier_group GROUP BY 1) g ON g.group_id = p.group_id
            GROUP BY 1, 2, 3, p.year
          ),
          yearly AS (
            SELECT *, SUM(deps) OVER (PARTITION BY code, year) AS item_deps,
              SUM(CASE WHEN year = CAST(:a AS integer) THEN deps ELSE 0 END) OVER (PARTITION BY code) AS deps_a
            FROM flown
          ),
          counted AS (
            SELECT *, MAX(year = CAST(:b AS integer)) OVER (PARTITION BY code) AS at_b,
              MIN(year) OVER (PARTITION BY code) AS first_year, MAX(year) OVER (PARTITION BY code) AS last_year,
              MAX(item_deps) OVER (PARTITION BY code) AS peak_deps, MAX(name) OVER (PARTITION BY code) AS item_name
            FROM yearly
            WHERE item_deps >= CAST(COALESCE(NULLIF(:min, ''), CASE WHEN :dir IN ('out', 'in') THEN 12 ELSE 24 END) AS integer)
          ),
          gone AS (
            SELECT *, MAX(CASE WHEN item_deps = peak_deps THEN year END) OVER (PARTITION BY code) AS peak_year
            FROM counted WHERE at_b = 0
          )
          SELECT code, item_name AS name, member, deps AS member_deps, deps_a, first_year, last_year, peak_year, peak_deps
          FROM gone
          WHERE year = peak_year
          ORDER BY peak_deps DESC, code, member_deps DESC

      # every domestic airport pair in one year, both directions together (a before b), for hovering an airport on the
      # all-airports map: the same routes, with the same rule for domestic and the same 24-flight cut-off, as routes_by_year
      # gives one airport by default with international hidden
      domestic_routes:
        sql: |
          SELECT MIN(origin, dest) AS a, MAX(origin, dest) AS b, year,
            SUM(deps) AS deps, SUM(seats) AS seats, SUM(passengers) AS passengers, SUM(freight) AS freight, 'domestic' AS service
          FROM route_year_totals
          WHERE year = CAST(:year AS integer) AND origin <> dest
          GROUP BY 1, 2
          HAVING SUM(deps) >= 24 AND SUM(domestic_deps) * 2 > SUM(deps)
          ORDER BY a, b

      family_by_year:
        sql: |
          SELECT
            year, family,
            CASE WHEN domestic = 1 THEN 'domestic' ELSE 'international' END AS service,
            CASE WHEN service_class IN ('G', 'P') THEN 'freight' ELSE 'passenger' END AS kind,
            SUM(deps) AS deps, SUM(seats) AS seats, SUM(passengers) AS passengers, SUM(freight) AS freight
          FROM family_year
          GROUP BY year, family, service, kind
          ORDER BY year, family

      carrier_group_by_year:
        title: "Airline groups by year"
        description: "One row per airline group, year, service and kind."
        sql: |
          SELECT
            year, group_id, group_name,
            CASE WHEN domestic = 1 THEN 'domestic' ELSE 'international' END AS service,
            CASE WHEN service_class IN ('G', 'P') THEN 'freight' ELSE 'passenger' END AS kind,
            SUM(deps) AS deps, SUM(seats) AS seats, SUM(passengers) AS passengers, SUM(freight) AS freight
          FROM carrier_group_year
          GROUP BY year, group_id, group_name, service, kind
          ORDER BY year, group_name

      aircraft_by_year:
        title: "Aircraft by year, with their family"
        description: "One row per aircraft, year, service and kind, with the aircraft's family, maker and BTS type."
        sql: |
          SELECT
            y.year,
            y.aircraft_type AS aircraft,
            COALESCE(t.name, CASE y.aircraft_type WHEN 'unknown' THEN 'Type not reported' ELSE 'Type ' || y.aircraft_type END) AS aircraft_name,
            COALESCE(f.family, 'Unknown') AS family,
            COALESCE(t.maker, 'Unknown maker') AS maker,
            COALESCE(t.kind, 'Unknown') AS aircraft_kind,
            CASE WHEN y.domestic = 1 THEN 'domestic' ELSE 'international' END AS service,
            CASE WHEN y.service_class IN ('G', 'P') THEN 'freight' ELSE 'passenger' END AS kind,
            SUM(y.deps) AS deps, SUM(y.seats) AS seats, SUM(y.passengers) AS passengers, SUM(y.freight) AS freight
          FROM type_year y
            LEFT JOIN aircraft_types t ON t.ac_typeid = y.aircraft_type
            LEFT JOIN aircraft_family f ON f.aircraft_type = y.aircraft_type
          GROUP BY y.year, y.aircraft_type, aircraft_name, family, maker, aircraft_kind, service, kind
          ORDER BY y.year, y.aircraft_type

      family_detail:
        title: "Aircraft families by year, version and airline group"
        description: "One row per family, year, version, airline group, service and kind. Leave family empty for every family, and group empty for every airline. Leave year empty for all years. Leave service (domestic or international) and kind (passenger or freight) empty for both. Sort within each year by name, passengers or freight; empty sorts by year alone."
        sql: |
          SELECT
            family, year, subfamily, group_id, group_name,
            CASE WHEN domestic = 1 THEN 'domestic' ELSE 'international' END AS service,
            CASE WHEN service_class IN ('G', 'P') THEN 'freight' ELSE 'passenger' END AS kind,
            SUM(deps) AS deps, SUM(seats) AS seats, SUM(passengers) AS passengers, SUM(freight) AS freight
          FROM family_detail_year
          WHERE (:family = '' OR family = :family) AND (:group = '' OR group_id = :group)
            AND (:year IN ('', 'all') OR year = CAST(:year AS INTEGER))
            AND (:service IN ('', 'all') OR service = :service)
            AND (:kind IN ('', 'all') OR kind = :kind)
          GROUP BY family, year, subfamily, group_id, group_name, service, kind
          ORDER BY year,
            CASE WHEN :sort = 'name' THEN group_name END,
            CASE WHEN :sort = 'passengers' THEN SUM(passengers) END DESC,
            CASE WHEN :sort = 'freight' THEN SUM(freight) END DESC,
            family

      family_aircraft:
        title: "An aircraft family by year, aircraft, service and kind"
        description: "One row per year, aircraft, service and kind for the aircraft family with the given name, all airlines together. Leave year empty for all years."
        sql: |
          SELECT
            a.year, a.aircraft,
            COALESCE(t.name, CASE a.aircraft WHEN 'unknown' THEN 'Type not reported' ELSE 'Type ' || a.aircraft END) AS aircraft_name,
            CASE WHEN a.domestic = 1 THEN 'domestic' ELSE 'international' END AS service,
            CASE WHEN a.service_class IN ('G', 'P') THEN 'freight' ELSE 'passenger' END AS kind,
            SUM(a.deps) AS deps, SUM(a.seats) AS seats, SUM(a.passengers) AS passengers, SUM(a.freight) AS freight
          FROM aircraft_carrier_year a
            LEFT JOIN aircraft_family f ON f.aircraft_type = a.aircraft
            LEFT JOIN aircraft_types t ON t.ac_typeid = a.aircraft
          WHERE COALESCE(f.family, 'Unknown') = :family
            AND (:year IN ('', 'all') OR a.year = CAST(:year AS INTEGER))
          GROUP BY a.year, a.aircraft, aircraft_name, service, kind
          ORDER BY a.year

      family_airlines:
        title: "An aircraft family's airlines, in a year or all years"
        description: "One row per airline group for the aircraft family with the given name, added up over service and kind (or just one: service is domestic or international, kind is passenger or freight), with the first and last years it flew. Leave aircraft empty for the whole family, or give one aircraft's id. Leave year empty for all years. Sort by name, passengers or freight; empty sorts by passengers, then freight."
        sql: |
          SELECT
            a.group_id, a.group_name,
            MIN(CASE WHEN a.deps > 0 THEN a.year END) AS first_year,
            MAX(CASE WHEN a.deps > 0 THEN a.year END) AS last_year,
            SUM(a.deps) AS deps, SUM(a.seats) AS seats, SUM(a.passengers) AS passengers, SUM(a.freight) AS freight
          FROM aircraft_carrier_year a
            LEFT JOIN aircraft_family f ON f.aircraft_type = a.aircraft
          WHERE COALESCE(f.family, 'Unknown') = :family
            AND (:aircraft = '' OR a.aircraft = :aircraft)
            AND (:year IN ('', 'all') OR a.year = CAST(:year AS INTEGER))
            AND (:service IN ('', 'all') OR CASE WHEN a.domestic = 1 THEN 'domestic' ELSE 'international' END = :service)
            AND (:kind IN ('', 'all') OR CASE WHEN a.service_class IN ('G', 'P') THEN 'freight' ELSE 'passenger' END = :kind)
          GROUP BY a.group_id, a.group_name
          ORDER BY
            CASE WHEN :sort = 'name' THEN a.group_name END,
            CASE WHEN :sort = 'freight' THEN SUM(a.freight) END DESC,
            SUM(a.passengers) DESC, SUM(a.freight) DESC, a.group_name

      aircraft_detail:
        title: "One aircraft by year, airline group, service and kind"
        description: "One row per year, airline group, service and kind for the aircraft with the given id (aircraft_types.ac_typeid). Leave group empty for every airline."
        sql: |
          SELECT
            year, group_id, group_name,
            CASE WHEN domestic = 1 THEN 'domestic' ELSE 'international' END AS service,
            CASE WHEN service_class IN ('G', 'P') THEN 'freight' ELSE 'passenger' END AS kind,
            SUM(deps) AS deps, SUM(seats) AS seats, SUM(passengers) AS passengers, SUM(freight) AS freight
          FROM aircraft_carrier_year
          WHERE aircraft = :aircraft AND (:group = '' OR group_id = :group)
          GROUP BY year, group_id, group_name, service, kind
          ORDER BY year

      type_table:
        title: "Aircraft types and families, in a year or all years"
        description: "One row per aircraft type, with its family and maker, the first and last years it flew, and its departures, seats, passengers and freight in the year. Leave year empty for all years."
        sql: |
          SELECT
            y.aircraft_type AS type_id,
            COALESCE(t.name, CASE y.aircraft_type WHEN 'unknown' THEN 'Type not reported' ELSE 'Type ' || y.aircraft_type END) AS name,
            COALESCE(f.family, 'Unknown') AS family,
            COALESCE(t.maker, 'Unknown maker') AS maker,
            COALESCE(t.kind, 'Unknown') AS aircraft_kind,
            MIN(CASE WHEN y.deps > 0 THEN y.year END) AS first_year,
            MAX(CASE WHEN y.deps > 0 THEN y.year END) AS last_year,
            SUM(CASE WHEN (:year IN ('', 'all') OR y.year = CAST(:year AS INTEGER)) THEN y.deps ELSE 0 END) AS deps,
            SUM(CASE WHEN (:year IN ('', 'all') OR y.year = CAST(:year AS INTEGER)) THEN y.seats ELSE 0 END) AS seats,
            SUM(CASE WHEN (:year IN ('', 'all') OR y.year = CAST(:year AS INTEGER)) THEN y.passengers ELSE 0 END) AS passengers,
            SUM(CASE WHEN (:year IN ('', 'all') OR y.year = CAST(:year AS INTEGER)) THEN y.freight ELSE 0 END) AS freight
          FROM type_year y
            LEFT JOIN aircraft_types t ON t.ac_typeid = y.aircraft_type
            LEFT JOIN aircraft_family f ON f.aircraft_type = y.aircraft_type
          GROUP BY y.aircraft_type
          ORDER BY y.aircraft_type

      # the airlines table: each member airline's chosen year (or every year) by service and kind, with the years it flew
      airline_table:
        title: "Airline groups and their airlines, in a year or all years"
        description: "One row per airline, service and kind, with its group and the first and last years it flew. Leave year empty for all years."
        sql: |
          SELECT
            d.group_id,
            d.group_name,
            d.airline_id,
            COALESCE(g.airline_name, d.group_name) AS airline_name,
            -- the two-letter code it flies under now (the latest start date on its carriers rows)
            (SELECT c.carrier FROM carriers c WHERE c.airline_id = d.airline_id
              ORDER BY substr(c.start_date_source, instr(c.start_date_source, ' ') - 4, 4) DESC LIMIT 1) AS carrier,
            CASE WHEN d.domestic = 1 THEN 'domestic' ELSE 'international' END AS service,
            CASE WHEN d.service_class IN ('G', 'P') THEN 'freight' ELSE 'passenger' END AS kind,
            MIN(CASE WHEN d.deps > 0 THEN d.year END) AS first_year,
            MAX(CASE WHEN d.deps > 0 THEN d.year END) AS last_year,
            SUM(CASE WHEN (:year IN ('', 'all') OR d.year = CAST(:year AS INTEGER)) THEN d.deps ELSE 0 END) AS deps,
            SUM(CASE WHEN (:year IN ('', 'all') OR d.year = CAST(:year AS INTEGER)) THEN d.seats ELSE 0 END) AS seats,
            SUM(CASE WHEN (:year IN ('', 'all') OR d.year = CAST(:year AS INTEGER)) THEN d.passengers ELSE 0 END) AS passengers,
            SUM(CASE WHEN (:year IN ('', 'all') OR d.year = CAST(:year AS INTEGER)) THEN d.freight ELSE 0 END) AS freight
          FROM carrier_group_year d
            LEFT JOIN carrier_group g ON g.airline_id = d.airline_id
          GROUP BY d.group_id, d.group_name, d.airline_id, airline_name, carrier, service, kind
          HAVING SUM(CASE WHEN (:year IN ('', 'all') OR d.year = CAST(:year AS INTEGER)) THEN d.deps ELSE 0 END) > 0
          ORDER BY d.group_id, d.airline_id

      maker_by_year:
        title: "Aircraft makers by year"
        description: "One row per maker, year, service and kind."
        sql: |
          SELECT
            y.year,
            COALESCE(t.maker, 'Unknown maker') AS maker,
            COALESCE(t.kind, 'Unknown') AS aircraft_kind,
            CASE WHEN y.domestic = 1 THEN 'domestic' ELSE 'international' END AS service,
            CASE WHEN y.service_class IN ('G', 'P') THEN 'freight' ELSE 'passenger' END AS kind,
            SUM(y.deps) AS deps, SUM(y.seats) AS seats, SUM(y.passengers) AS passengers, SUM(y.freight) AS freight
          FROM type_year y LEFT JOIN aircraft_types t ON t.ac_typeid = y.aircraft_type
          GROUP BY y.year, maker, aircraft_kind, service, kind
          ORDER BY y.year, maker

      # what the airline search offers: every group, and each member of a merged group on its own
      airline_list:
        sql: |
          SELECT group_id AS id, group_name AS name, '' AS parent, MIN(year) AS first_year, MAX(year) AS last_year, SUM(deps) AS deps
          FROM carrier_group_year
          GROUP BY group_id, group_name
          UNION ALL
          SELECT d.airline_id, COALESCE(g.airline_name, d.group_name), d.group_name, MIN(d.year), MAX(d.year), SUM(d.deps)
          FROM carrier_group_year d
          LEFT JOIN carrier_group g ON g.airline_id = d.airline_id
          WHERE d.group_id IN (SELECT group_id FROM carrier_group_year GROUP BY group_id HAVING COUNT(DISTINCT airline_id) > 1)
          GROUP BY d.airline_id, COALESCE(g.airline_name, d.group_name), d.group_name
          ORDER BY deps DESC

      # what the airport search offers: every airport flown from, US or not, busiest first
      airport_list:
        title: "Every airport flown from or to, busiest first"
        description: "One row per airport: its code, place and name, the first and last years with flights from or to it, and its flights both ways in all years."
        sql: |
          SELECT y.airport AS code, COALESCE(n.name, MAX(y.city_name)) AS place, o.name AS name,
            MIN(y.year) AS first_year, MAX(y.year) AS last_year, SUM(y.deps + y.arrs) AS deps
          FROM airport_dir_year y
          LEFT JOIN airport_names n ON n.code = y.airport
          LEFT JOIN (SELECT iata_code, MIN(name) AS name FROM openflights_airports GROUP BY iata_code) o ON o.iata_code = y.airport
          GROUP BY y.airport
          ORDER BY deps DESC

      # the header search: up to three typed words (t1, t2, t3, any left empty), each of which must start a word of the thing's terms;
      # at most 6 airports, 6 airlines and 6 aircraft, an exact code first, then a label that starts with the first word, then the busiest;
      # the kind with the best match leads, so the first row is the best match overall (airports, airlines, aircraft when kinds tie)
      search:
        title: "Search for an airport, airline or aircraft"
        description: "Up to six airports, six airlines and six aircraft (families included) each, for up to three words (t1, t2, t3) that each start a word of its code, name, city or country. An exact code comes first, then a name starting with the first word, then the busiest."
        sql: |
          WITH q AS (
            SELECT lower(trim(COALESCE(:t1, ''))) AS t1, lower(trim(COALESCE(:t2, ''))) AS t2, lower(trim(COALESCE(:t3, ''))) AS t3
          ), e AS (
            SELECT t1, t2, t3,
              replace(replace(replace(t1, '\', '\\'), '%', '\%'), '_', '\_') AS e1,
              replace(replace(replace(t2, '\', '\\'), '%', '\%'), '_', '\_') AS e2,
              replace(replace(replace(t3, '\', '\\'), '%', '\%'), '_', '\_') AS e3
            FROM q
          ), hits AS (
            SELECT s.kind, s.href, s.label, s.hint, s.rank,
              CASE WHEN s.code <> '' AND lower(s.code) = e.t1 THEN 0
                   WHEN lower(s.label) LIKE e.e1 || '%' ESCAPE '\' THEN 1 ELSE 2 END AS score
            FROM search_index s, e
            WHERE e.t1 <> ''
              AND ' ' || s.terms LIKE '% ' || e.e1 || '%' ESCAPE '\'
              AND (e.t2 = '' OR ' ' || s.terms LIKE '% ' || e.e2 || '%' ESCAPE '\')
              AND (e.t3 = '' OR ' ' || s.terms LIKE '% ' || e.e3 || '%' ESCAPE '\')
          ), ranked AS (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY kind ORDER BY score, rank DESC, label) AS n,
              MIN(score) OVER (PARTITION BY kind) AS best FROM hits
          )
          SELECT kind, href, label, hint FROM ranked WHERE n <= 6
          ORDER BY best, CASE kind WHEN 'airport' THEN 0 WHEN 'airline' THEN 1 ELSE 2 END, score, rank DESC, label

      # what the aircraft search offers: every aircraft flown, with its family, named as the aircraft pages name them, busiest first
      aircraft_list:
        title: "Every aircraft flown, with its family, busiest first"
        description: "One row per aircraft: its family and name, the first and last years it flew, and its departures in all years."
        sql: |
          SELECT COALESCE(f.family, 'Unknown') AS family,
            COALESCE(t.name, CASE y.aircraft_type WHEN 'unknown' THEN 'Type not reported' ELSE 'Type ' || y.aircraft_type END) AS name,
            MIN(y.year) AS first_year, MAX(y.year) AS last_year, SUM(y.deps) AS deps
          FROM type_year y
          LEFT JOIN aircraft_types t ON t.ac_typeid = y.aircraft_type
          LEFT JOIN aircraft_family f ON f.aircraft_type = y.aircraft_type
          WHERE y.deps > 0
          GROUP BY y.aircraft_type
          ORDER BY deps DESC

      # the airline queries take :group (a merged group's id, or an airline's own) and :airline ('' for the whole group, or one member)
      carrier_group_detail:
        title: "An airline group, or one of its airlines, by year"
        description: "One row per year, service and kind. Leave airline empty for the whole group."
        sql: |
          SELECT
            d.year,
            CASE WHEN d.domestic = 1 THEN 'domestic' ELSE 'international' END AS service,
            CASE WHEN d.service_class IN ('G', 'P') THEN 'freight' ELSE 'passenger' END AS kind,
            SUM(d.deps) AS deps, SUM(d.seats) AS seats, SUM(d.passengers) AS passengers, SUM(d.freight) AS freight
          FROM carrier_group_year d
          WHERE d.group_id = :group AND (:airline = '' OR d.airline_id = :airline)
          GROUP BY d.year, service, kind
          ORDER BY d.year

      carrier_route_counts:
        sql: |
          -- airport pairs, both directions together
          SELECT year, COUNT(*) AS pairs
          FROM (
            SELECT year, MIN(origin, dest), MAX(origin, dest), SUM(deps) AS deps
            FROM carrier_pair_year
            WHERE group_id = :group AND (:airline = '' OR airline_id = :airline)
            GROUP BY 1, 2, 3
          )
          WHERE deps >= CAST(:min AS INTEGER)
          GROUP BY year
          ORDER BY year

      carrier_routes_year:
        title: "An airline's airport pairs in one year"
        description: "One row per airline and airport pair flown in the year: both directions together (origin before dest), or set each to each for each direction as flown. Leave airline empty for the whole group. Give a year."
        sql: |
          SELECT r.airline_id, COALESCE(g.airline_name, 'Unknown carrier') AS airline,
            CASE WHEN :each = 'each' THEN r.origin ELSE MIN(r.origin, r.dest) END AS origin,
            CASE WHEN :each = 'each' THEN r.dest ELSE MAX(r.origin, r.dest) END AS dest,
            SUM(r.deps) AS deps, SUM(r.seats) AS seats, SUM(r.passengers) AS passengers, SUM(r.freight) AS freight, SUM(r.domestic_deps) AS domestic_deps
          FROM carrier_pair_year r
          LEFT JOIN carrier_group g ON g.airline_id = r.airline_id
          WHERE r.group_id = :group AND (:airline = '' OR r.airline_id = :airline) AND r.year = :year
          GROUP BY r.airline_id, airline, 3, 4
          ORDER BY passengers DESC

      # an airline's pairs no longer flown by b: flown at least min times in some year from a up to b, but not in b. The map
      # draws the ones added then dropped in between (those flown in a it already has); the changes page lists them all. A
      # pair is both directions together (origin before dest), or each direction as flown with each=each, as
      # carrier_route_changes. Each pair-year is added up over the group's airlines first, so `min` counts as the map counts;
      # one pass with window functions (joining back is far slower)
      carrier_routes_gone:
        title: "An airline's airport pairs no longer flown by a year"
        description: "One row per airport pair, member airline and year from a up to b, for the pairs flown at least min times (24 when empty, 12 with each=each) in some year then but not in b: both directions together (origin before dest), or set each to each for each direction as flown. Leave airline empty for the whole group."
        sql: |
          WITH pairs AS (
            SELECT r.year, r.airline_id,
              CASE WHEN :each = 'each' THEN r.origin ELSE MIN(r.origin, r.dest) END AS origin,
              CASE WHEN :each = 'each' THEN r.dest ELSE MAX(r.origin, r.dest) END AS dest,
              SUM(r.deps) AS deps, SUM(r.seats) AS seats, SUM(r.passengers) AS passengers, SUM(r.freight) AS freight, SUM(r.domestic_deps) AS domestic_deps
            FROM carrier_pair_year r
            WHERE r.group_id = :group AND (:airline = '' OR r.airline_id = :airline)
              AND r.year BETWEEN CAST(:a AS integer) AND CAST(:b AS integer)
            GROUP BY r.year, r.airline_id, 3, 4
          ),
          ranged AS (
            SELECT *, SUM(deps) OVER (PARTITION BY origin, dest, year) AS pair_deps FROM pairs
          ),
          flown AS (
            SELECT *, MAX(year = CAST(:b AS integer)) OVER (PARTITION BY origin, dest) AS at_b
            FROM ranged
            WHERE pair_deps >= CAST(COALESCE(NULLIF(:min, ''), CASE WHEN :each = 'each' THEN 12 ELSE 24 END) AS integer)
          )
          SELECT f.year, f.airline_id, COALESCE(g.airline_name, 'Unknown carrier') AS airline, f.origin, f.dest,
            f.deps, f.seats, f.passengers, f.freight, f.domestic_deps
          FROM flown f
          LEFT JOIN carrier_group g ON g.airline_id = f.airline_id
          WHERE f.at_b = 0
          ORDER BY f.year, f.passengers DESC

      # an airline's routes matrix: each airport pair (both directions together) by year, flown at least 12 times
      carrier_route_by_year:
        title: "An airline's airport pairs by year"
        description: "One row per airport pair and year: both directions together (origin before dest) flown at least 24 times, or set each to each for each direction as flown at least 12 times. Leave airline empty for the whole group."
        sql: |
          SELECT
            CASE WHEN :each = 'each' THEN r.origin ELSE MIN(r.origin, r.dest) END AS origin,
            CASE WHEN :each = 'each' THEN r.dest ELSE MAX(r.origin, r.dest) END AS dest,
            r.year,
            SUM(r.deps) AS deps, SUM(r.seats) AS seats, SUM(r.passengers) AS passengers, SUM(r.freight) AS freight,
            CASE WHEN SUM(r.domestic_deps) * 2 > SUM(r.deps) THEN 'domestic' ELSE 'international' END AS service
          FROM carrier_pair_year r
          WHERE r.group_id = :group AND (:airline = '' OR r.airline_id = :airline)
          GROUP BY 1, 2, r.year
          HAVING SUM(r.deps) >= CASE :each WHEN 'each' THEN 12 ELSE 24 END
          ORDER BY r.year, 1, 2

      # an airline's aircraft matrix: each aircraft by year, with its family, as the aircraft matrix has them for all airlines
      carrier_aircraft_by_year:
        title: "An airline's aircraft by year, with their family"
        description: "One row per aircraft, year, service and kind for the airline group, with the aircraft's family, maker and BTS type. Leave airline empty for the whole group."
        sql: |
          SELECT
            a.year, a.aircraft,
            COALESCE(t.name, CASE a.aircraft WHEN 'unknown' THEN 'Type not reported' ELSE 'Type ' || a.aircraft END) AS aircraft_name,
            COALESCE(f.family, 'Unknown') AS family,
            COALESCE(t.maker, 'Unknown maker') AS maker,
            COALESCE(t.kind, 'Unknown') AS aircraft_kind,
            CASE WHEN a.domestic = 1 THEN 'domestic' ELSE 'international' END AS service,
            CASE WHEN a.service_class IN ('G', 'P') THEN 'freight' ELSE 'passenger' END AS kind,
            SUM(a.deps) AS deps, SUM(a.seats) AS seats, SUM(a.passengers) AS passengers, SUM(a.freight) AS freight
          FROM aircraft_carrier_year a
            LEFT JOIN aircraft_types t ON t.ac_typeid = a.aircraft
            LEFT JOIN aircraft_family f ON f.aircraft_type = a.aircraft
          WHERE a.group_id = :group AND (:airline = '' OR a.airline_id = :airline)
          GROUP BY a.year, a.aircraft, aircraft_name, family, maker, aircraft_kind, service, kind
          ORDER BY a.year, a.aircraft

      carrier_route_changes:
        title: "An airline's airport pairs in two years"
        description: "One row per airport pair and airline flown in either year: both directions together (origin before dest), or set each to each for each direction as flown; with the first and last month flown. Leave airline empty for the whole group."
        sql: |
          SELECT
            CASE WHEN :each = 'each' THEN r.origin ELSE MIN(r.origin, r.dest) END AS origin,
            CASE WHEN :each = 'each' THEN r.dest ELSE MAX(r.origin, r.dest) END AS dest,
            r.airline_id, COALESCE(g.airline_name, 'Unknown carrier') AS airline,
            SUM(CASE WHEN r.year = :a THEN r.deps ELSE 0 END) AS deps_a,
            SUM(CASE WHEN r.year = :b THEN r.deps ELSE 0 END) AS deps_b,
            SUM(CASE WHEN r.year = :a THEN r.passengers ELSE 0 END) AS pax_a,
            SUM(r.deps) AS deps_all,
            MIN(r.year * 100 + r.first_month) AS first_ym,
            MAX(r.year * 100 + r.last_month) AS last_ym
          FROM carrier_pair_year r
          LEFT JOIN carrier_group g ON g.airline_id = r.airline_id
          WHERE r.group_id = :group AND (:airline = '' OR r.airline_id = :airline)
          GROUP BY 1, 2, r.airline_id, airline
          HAVING deps_a > 0 OR deps_b > 0
          ORDER BY deps_a DESC, deps_b DESC

      engines_by_year:
        title: "Departures by number of engines and distance, by year"
        description: "One row per year, engine count, distance band and kind."
        sql: |
          SELECT
            year, aircraft_group, distance_band,
            CASE WHEN domestic = 1 THEN 'domestic' ELSE 'international' END AS service,
            CASE WHEN service_class IN ('G', 'P') THEN 'freight' ELSE 'passenger' END AS kind,
            SUM(deps) AS deps, SUM(seats) AS seats, SUM(passengers) AS passengers, SUM(freight) AS freight
          FROM aircraft_group_band_year
          GROUP BY year, aircraft_group, distance_band, service, kind
          ORDER BY year, aircraft_group, distance_band

      routes_by_month:
        sql: |
          -- as routes_by_year, by month of one year: dest is the other airport, and dir other than out or in counts both ways
          WITH legs AS (
            SELECT dest AS other, month, departures_performed, seats, passengers, freight, domestic
            FROM t100 WHERE origin = :origin AND year = :year AND :dir <> 'in'
            UNION ALL
            SELECT origin, month, departures_performed, seats, passengers, freight, domestic
            FROM t100 WHERE dest = :origin AND year = :year AND :dir <> 'out'
          )
          SELECT
            other AS dest,
            month,
            SUM(departures_performed) AS deps,
            SUM(seats) AS seats,
            SUM(passengers) AS passengers,
            SUM(freight) AS freight,
            CASE WHEN SUM(CASE WHEN domestic = 1 THEN departures_performed ELSE 0 END) * 2
                      > SUM(departures_performed)
                 THEN 'domestic' ELSE 'international' END AS service
          FROM legs
          WHERE other IN (
            SELECT other FROM legs
            GROUP BY other
            HAVING SUM(departures_performed) >= CAST(COALESCE(NULLIF(:min_deps, ''), CASE WHEN :dir IN ('out', 'in') THEN 12 ELSE 24 END) AS integer)
          )
          GROUP BY other, month
          HAVING SUM(departures_performed) > 0 OR SUM(passengers) > 0 OR SUM(freight) > 0
          ORDER BY month, other

      route:
        title: "Every carrier and aircraft on a route, by year"
        description: "One row per year, carrier and aircraft, for flights between the origin and the destination: both directions, or set dir to out (origin to destination) or in (the reverse). Leave group empty for every airline."
        sql: >
          WITH cn AS (
            -- BTS lists an airline's entity once per name and start date, and often repeats a row, so joining on the entity
            -- alone would count every segment once per row. Make one period per name instead, each running until the next name starts.
            SELECT carrier_entity AS entity, name, MIN(airline_id) AS airline_id,
              CAST(substr(start_date_source, instr(start_date_source, ' ') - 4, 4) AS INTEGER) * 100
                + CAST(substr(start_date_source, 1, instr(start_date_source, '/') - 1) AS INTEGER) AS s
            FROM carriers
            GROUP BY carrier_entity, name, s
          ), cp AS (
            SELECT entity, name, airline_id,
              CASE WHEN ROW_NUMBER() OVER w = 1 THEN 0 ELSE s END AS s2,
              COALESCE(LEAD(s) OVER w - 1, 999912) AS e2
            FROM cn
            WINDOW w AS (PARTITION BY entity ORDER BY s, name)
          )
          SELECT
            year,
            origin_city_name,
            dest_city_name,
            cp.name AS carrier,
            a.name AS aircraft,
            MIN(g.group_id) AS group_id,
            MIN(g.group_name) AS group_name,
            MIN(f.family) AS family,
            SUM(departures_performed) AS deps,
            SUM(departures_scheduled) AS scheduled,
            SUM(payload) AS total_payload,
            SUM(seats) AS total_seats,
            SUM(passengers) AS total_passengers,
            -- Calculate the true load factor for the whole year based on the new aggregated sums
            ROUND((1.0 * SUM(passengers)) / SUM(seats) * 100, 1) AS load_factor,
            SUM(freight) AS total_freight,
            '/t100/route_year?origin=' || origin || '&dest=' || dest || '&year=' || year || '&_hide_sql=1' as more_detail
          FROM t100 AS t
            JOIN aircraft_types a ON t.aircraft_type = a.AC_TYPEID
            LEFT JOIN cp ON cp.entity = t.carrier_entity AND t.year * 100 + t.month BETWEEN cp.s2 AND cp.e2
            LEFT JOIN carrier_group g ON g.airline_id = cp.airline_id
            LEFT JOIN aircraft_family f ON f.aircraft_type = t.aircraft_type
          WHERE
            -- both directions unless dir says one: out is origin to dest, in the reverse
            ((origin = :origin AND dest = :dest AND :dir IN ('', 'out')) OR (origin = :dest AND dest = :origin AND :dir IN ('', 'in')))
            AND (:group = '' OR g.group_id = :group)
          GROUP BY
            year,
            cp.name,
            a.name
          ORDER BY
            year DESC,
            a.name ASC,
            cp.name ASC,
            total_passengers DESC

      route_year:
        title: "Every carrier and aircraft on a route, by month, in one year"
        description: "One row per month, carrier and aircraft, for flights between the origin and the destination in the year: both directions, or set dir to out (origin to destination) or in (the reverse). Leave group empty for every airline. Give a year."
        sql: >
          WITH cn AS (
            -- BTS lists an airline's entity once per name and start date, and often repeats a row, so joining on the entity
            -- alone would count every segment once per row. Make one period per name instead, each running until the next name starts.
            SELECT carrier_entity AS entity, name, MIN(airline_id) AS airline_id,
              CAST(substr(start_date_source, instr(start_date_source, ' ') - 4, 4) AS INTEGER) * 100
                + CAST(substr(start_date_source, 1, instr(start_date_source, '/') - 1) AS INTEGER) AS s
            FROM carriers
            GROUP BY carrier_entity, name, s
          ), cp AS (
            SELECT entity, name, airline_id,
              CASE WHEN ROW_NUMBER() OVER w = 1 THEN 0 ELSE s END AS s2,
              COALESCE(LEAD(s) OVER w - 1, 999912) AS e2
            FROM cn
            WINDOW w AS (PARTITION BY entity ORDER BY s, name)
          )
          SELECT
            year,
            printf('%02d', month) AS month,
            origin_city_name,
            dest_city_name,
            cp.name AS carrier,
            a.name AS aircraft,
            g.group_id AS group_id,
            g.group_name AS group_name,
            f.family AS family,
            departures_performed AS deps,
            departures_scheduled AS scheduled,
            payload AS total_payload,
            seats AS total_seats,
            passengers AS total_passengers,
            ROUND((1.0 * passengers) / seats * 100, 1) AS load_factor,
            freight AS total_freight,
            ramp_to_ramp AS total_ramp_time,
            air_time AS total_air_time
          FROM t100 AS t
            JOIN aircraft_types a ON t.aircraft_type = a.AC_TYPEID
            LEFT JOIN cp ON cp.entity = t.carrier_entity AND t.year * 100 + t.month BETWEEN cp.s2 AND cp.e2
            LEFT JOIN carrier_group g ON g.airline_id = cp.airline_id
            LEFT JOIN aircraft_family f ON f.aircraft_type = t.aircraft_type
          WHERE
            -- both directions unless dir says one: out is origin to dest, in the reverse
            ((origin = :origin AND dest = :dest AND :dir IN ('', 'out')) OR (origin = :dest AND dest = :origin AND :dir IN ('', 'in')))
            AND year = :year
            AND (:group = '' OR g.group_id = :group)
          ORDER BY
            month ASC,
            a.name ASC,
            cp.name ASC,
            total_passengers DESC
