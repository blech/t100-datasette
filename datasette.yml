settings:
  default_page_size: 100
  max_returned_rows: 50000
  sql_time_limit_ms: 5000

databases:
  t100:
    title: T-100 International Segment Data, 1990-2025
    source: Data Bank 28IS - T-100 and T-100(f) International Segment Data, U.S. and Foreign Air Carriers Traffic and Capacity Data
    source_url: https://www.bts.gov/browse-statistical-products-and-data/bts-publications/%E2%80%A2-data-bank-28is-t-100-and-t-100f

    queries:
      top_us_airports:
        sql: |
          SELECT
            origin,
            origin_city_name,
            CAST(SUM(departures_performed) AS integer) AS total_deps,
            CAST(SUM(passengers) AS integer) AS total_passengers,
            CAST(SUM(seats) AS integer) AS total_seats,
            CAST(SUM(freight) AS integer) AS total_freight,
            '/t100/destinations?origin=' || origin || '&_hide_sql=1' AS more_detail
          FROM t100
          WHERE origin_wac BETWEEN 1 AND 93
            AND year = COALESCE(NULLIF(:year, ''), 2025)
          GROUP BY origin, origin_wac, origin_city_name
          ORDER BY
            CASE :sort_column
              WHEN 'Departures' THEN total_deps
              WHEN 'Seats' THEN total_seats
              WHEN 'Freight' THEN total_freight
              ELSE total_passengers
            END
            DESC
          LIMIT 100;

      destinations:
        sql: |
          SELECT
            year || '-' || printf('%02d', month) AS date,
            dest,
            dest_city_name,
            sum(departures_performed) as deps,
            sum(seats) as seats,
            sum(passengers) as total_pax,
            sum(freight) as freight,
            '/t100/route?origin=' || origin || '&dest=' || dest || '&_hide_sql=1&_plot-mark=%7B"mark"%3A"bar-y"%2C"options"%3A%7B"x"%3A"year"%2C"y"%3A"deps"%2C"fill"%3A"aircraft"%2C"tip"%3Atrue%7D%7D' as more_detail
          FROM t100 AS t
          WHERE origin = :origin
          GROUP by dest, date
          ORDER BY
            date DESC,
            CASE :sort_column
              WHEN 'departures' THEN deps
              WHEN 'seats' THEN seats
              WHEN 'passengers' THEN total_pax
              WHEN 'freight' THEN freight
              ELSE dest_city_name
            END
            DESC
      destinations_map:
        sql: |
          SELECT
            year || '-' || printf('%02d', month) AS date,
            dest,
            dest_city_name,
            sum(departures_performed) as deps,
            sum(seats) as seats,
            sum(passengers) as total_pax,
            ROUND ((1.0 * passengers) / (seats * 100.0), 1) as load_factor,
            sum(freight) as freight,

            '{"type": "LineString", "coordinates": [[' ||
              orig_airport.longitude || ',' || orig_airport.latitude || '],[' ||
              dest_airport.longitude || ',' || dest_airport.latitude || ']]}' AS geometry,

            orig_airport.longitude AS origin_lon,
            orig_airport.latitude AS origin_lat,
            dest_airport.longitude AS destination_lon,
            dest_airport.latitude AS destination_lat
          FROM t100 AS t
            LEFT JOIN openflights_airports AS dest_airport ON t.dest = dest_airport.iata_code
            LEFT JOIN openflights_airports AS orig_airport ON t.origin = orig_airport.iata_code
          WHERE origin = :origin
          GROUP by dest, date
          ORDER BY
            date DESC,
            deps DESC,
            dest_city_name ASC

      route:
        sql: >
          SELECT
            year,
            origin_city_name,
            dest_city_name,
            c.name AS carrier,
            a.name AS aircraft,
            SUM(departures_performed) AS deps,
            SUM(departures_scheduled) AS scheduled,
            SUM(payload) AS total_payload,
            SUM(seats) AS total_seats,
            SUM(passengers) AS total_passengers,
            -- Calculate the true load factor for the whole year based on the new aggregated sums
            ROUND((1.0 * SUM(passengers)) / SUM(seats) * 100, 1) AS load_factor,
            SUM(freight) AS total_freight,
            '/t100/route_year?origin=' || origin || '&dest=' || dest || '&year=' || year || '&_hide_sql=1&_plot-mark=%7B"mark"%3A"bar-y"%2C"options"%3A%7B"x"%3A"month"%2C"y"%3A"deps"%2C"fill"%3A"aircraft"%2C"tip"%3Atrue%7D%7D' as more_detail
          FROM t100 AS t
            JOIN aircraft_types a ON t.aircraft_type = a.AC_TYPEID
            JOIN carriers c ON t.carrier_entity = c.CARRIER_ENTITY
          WHERE
            origin = :origin
            AND dest = :dest
          GROUP BY
            year,
            c.name,
            a.name
          ORDER BY
            year DESC,
            a.name ASC,
            c.name ASC,
            total_passengers DESC

      route_year:
        sql: >
          SELECT
            year,
            printf('%02d', month) AS month,
            origin_city_name,
            dest_city_name,
            c.name AS carrier,
            a.name AS aircraft,
            departures_performed AS deps,
            departures_scheduled AS scheduled,
            payload AS total_payload,
            seats AS total_seats,
            passengers AS total_passengers,
            ROUND((1.0 * passengers) / seats * 100, 1) AS load_factor,
            freight AS total_freight,
            ramp_to_ramp AS total_ramp_time,
            air_time AS total_air_time
          FROM t100 AS t
            JOIN aircraft_types a ON t.aircraft_type = a.AC_TYPEID
            JOIN carriers c ON t.carrier_entity = c.CARRIER_ENTITY
          WHERE
            origin = :origin
            AND dest = :dest
            AND year = :year
          ORDER BY
            month ASC,
            a.name ASC,
            c.name ASC,
            total_passengers DESC

